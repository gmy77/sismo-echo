# ============================================================================
#  FVG GRIB Monitor - configurazione
#  Questo file va accanto all'eseguibile (FVG-GribMonitor.exe).
# ============================================================================

[grib]
# URL da cui il pulsante "Scarica ultimo GRIB" scarica il file aggiornato.
# Lascia vuoto se non hai ancora una sorgente: il pulsante mostrera' un
# messaggio che ti ricorda di impostarlo qui.
#
# Sorgente automatica: la genera il workflow .github/workflows/fvg-grib-data.yml
# (ritaglio SOLO FVG dal GFS, aggiornato ~4 volte al giorno) e la pubblica come
# asset della Release "fvg-data". Per cambiarla basta incollare un altro URL.
grib_url = https://github.com/gmy77/sismo-echo/releases/download/fvg-data/FVG_latest.grib2

[update]
# Repository GitHub controllato dal pulsante "Controlla aggiornamenti".
# L'app confronta la sua versione con l'ultima Release di questo repo.
update_owner = gmy77
update_repo  = sismo-echo
